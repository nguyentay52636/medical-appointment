# OpenRouter Configuration
spring.ai.openai.api-key=${OPENROUTER_API_KEY:dummy-openrouter-key}
spring.ai.openai.base-url=https://openrouter.ai/api
spring.ai.openai.chat.options.model=meituan/longcat-flash-chat:free
spring.ai.openai.chat.options.temperature=1
spring.ai.openai.embedding.enabled=false
spring.ai.embedding.transformer.enabled=true

# Pinecone Configuration
pinecone.api-key=${PINECONE_API_KEY:dummy-pinecone-key}
pinecone.index-name=doctor

# Spring Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=appointment-group
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# VietMap Key
